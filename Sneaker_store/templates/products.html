{% extends "base.html" %}

{% block title %}
Sneaker Hub | Products
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="section-heading">
        <div>
            <span>OUR COLLECTION</span>
            <h2>Premium Sneakers</h2>
        </div>
    </div>

    <div class="row g-4">

        {% for sneaker in sneakers %}

        <div class="col-lg-4 col-md-6">

            <div class="card h-100">

                <img
                    src="{{ url_for('static', filename='images/' + sneaker.image) }}"
                    class="card-img-top"
                    alt="{{ sneaker.name }}"
                >

                <div class="card-body d-flex flex-column">

                    <h5 class="card-title">
                        {{ sneaker.name }}
                    </h5>

                    <p class="card-text">
                        Rs. {{ sneaker.price }}
                    </p>

                    <a
                        href="{{ url_for('add_to_cart', product_id=sneaker.id) }}"
                        class="btn btn-dark mt-auto"
                    >
                        Add to Cart
                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}

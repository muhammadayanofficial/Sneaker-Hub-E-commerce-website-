<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Sneaker Hub
        {% endblock %}
    </title>

    <style>
        html,
        body {
            background: #080B14;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 99999;
        }

        /* Hide loader immediately after first visit */
        body.loader-seen #loader {
            display: none !important;
        }
    </style>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script>
        if (sessionStorage.getItem("sneakerHubVisited") === "true") {
            document.documentElement.classList.add("loader-already-seen");
        }
    </script>

</head>

<body>

    <!-- LOADING SCREEN -->
    <div id="loader">

        <div class="loader-content">

            <div class="loader-logo">
                SNEAKER <span>HUB</span>
            </div>

            <div class="loader-line">
                <div class="loader-progress"></div>
            </div>

            <p>STEP INTO SOMETHING DIFFERENT.</p>

        </div>

    </div>


    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a
                class="navbar-brand"
                href="{{ url_for('home') }}"
            >
                Sneaker Hub
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                ☰
            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('home') }}"
                        >
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('products') }}"
                        >
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('about') }}"
                        >
                            About
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('cart') }}"
                        >
                             Cart
                        </a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input
                        class="form-control me-2"
                        type="search"
                        placeholder="Search sneakers..."
                    >

                    <button
                        class="btn btn-outline-dark"
                        type="submit"
                    >
                        Search
                    </button>

                </form>

            </div>

        </div>

    </nav>


    <main>

        {% block content %}

        {% endblock %}

    </main>


    <footer class="py-4 text-center">

        <div class="container">

            <p class="mb-0">
                © 2026 Sneaker Hub — Built for every move.
            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        window.addEventListener("load", function () {

            const loader = document.getElementById("loader");

            if (sessionStorage.getItem("sneakerHubVisited") === "true") {

                if (loader) {
                    loader.remove();
                }

                return;
            }

            sessionStorage.setItem("sneakerHubVisited", "true");

            setTimeout(function () {

                if (loader) {
                    loader.remove();
                }

            }, 3000);

        });

    </script>


</body>

</html>
